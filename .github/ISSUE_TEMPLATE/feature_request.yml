name: Feature Request
description: Suggest an idea or enhancement for Native Form
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We welcome new feature ideas, adapter proposals, and ergonomic enhancements!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the use case or limitation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: How should this API or feature work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you have considered.
